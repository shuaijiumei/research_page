<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News - Boyin Tan</title>
    <link rel="stylesheet" href="../styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @media (max-width: 640px) {
        .news-archive-page .news-content,
        .news-archive-page .news-content span {
          display: block;
          width: min(100%, 290px) !important;
          max-width: 290px !important;
          overflow-wrap: anywhere;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body class="archive-page news-archive-page">
    <nav class="archive-nav glass">
      <div class="archive-nav-inner">
        <a href="../index.html" class="archive-brand">Boyin Tan</a>
        <div class="archive-nav-links">
          <a href="../index.html#latest-news">News</a>
          <a href="../index.html#publications">Publications</a>
          <a href="../index.html#contact">Contact</a>
        </div>
      </div>
    </nav>

    <main class="archive-main">
      <section id="all-news" class="archive-shell">
        <div class="archive-kicker">
          <a href="../index.html" class="archive-back-link">
            <i class="fas fa-arrow-left"></i>
            Homepage
          </a>
        </div>

        <header class="archive-header">
          <h1>News</h1>
          <p>Updates on publications, research milestones, and homepage changes.</p>
        </header>

        <div class="archive-panel">
          <div id="all-news-container" class="news-list archive-news-list">
            <!-- News items will be dynamically loaded here from news.json -->
          </div>
        </div>
      </section>
    </main>

    <footer class="archive-footer">
      <p>&copy; <span id="current-year"></span> Boyin Tan. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById("current-year").textContent =
        new Date().getFullYear();
    </script>
    <script src="../script.js"></script>
  </body>
</html>
